[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reposcope"
version = "0.1.0"
description = "RepoScope Agent — Python 仓库结构理解 Agent"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "networkx>=3.0",
    "rich>=13.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
reposcope = "reposcope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

